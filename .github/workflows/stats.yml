
name: GitHub Profile Statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: false

jobs:
  generate-stats:
    name: Generate GitHub Statistics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Generate statistics cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        with:
          USERNAME: opxnd
          BRANCH_NAME: main
          TIME_ZONE: Asia/Baghdad
          THEME: github_dark
          AUTO_PUSH: false

      - name: Update repository languages
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: python3 .github/scripts/update_languages.py

      - name: Show exact GitHub join date
        run: |
          python3 - <<'PY'
          import json
          import re
          import urllib.request
          from pathlib import Path

          request = urllib.request.Request(
              "https://api.github.com/users/opxnd",
              headers={
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "opxnd-profile"
              }
          )

          with urllib.request.urlopen(request) as response:
              user = json.load(response)

          joined = user["created_at"][:10]

          path = Path(
              "profile-summary-card-output/"
              "github_dark/0-profile-details.svg"
          )

          svg = path.read_text(encoding="utf-8")

          svg, count = re.subn(
              r"Joined GitHub \d+ (?:year|month|day)s? ago",
              f"Joined GitHub: {joined}",
              svg
          )

          if count != 1:
              raise ValueError(
                  "Could not locate the GitHub join date"
              )

          path.write_text(svg, encoding="utf-8")
          print(f"GitHub join date: {joined}")
          PY

      - name: Save statistics and README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md profile-summary-card-output/

          if ! git diff --cached --quiet; then
            git commit -m "Update GitHub profile statistics"
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi
